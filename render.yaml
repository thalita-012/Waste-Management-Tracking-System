services:
  - type: web
    name: wmts-backend
    runtime: node
    buildCommand: npm install && npx prisma db push && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
